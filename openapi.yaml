            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnResourcePaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/bpmn/validate:
    post:
      summary: Validate BPMN XML without saving
      operationId: ValidateBpmnXml
      x-required-role: editor
      description: |
        Parses BPMN XML and reports any structural errors or warnings.
        Useful for showing inline validation in design tools without
        committing the resource. The same checks are run server-side
        before storing or deploying a resource.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateBpmnResourceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnValidateResponse'
  /projects/{projectID}/bpmn/instances:
    get:
      summary: List BPMN instances
      operationId: ListBpmnInstances
      x-required-role: viewer
      description: Returns paginated process instances in the project, optionally filtered by process, version or status.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - RUNNING
              - COMPLETED
              - FAILED
              - CANCELED
              - TERMINATED
        - name: hasIncident
          in: query
          required: false
          description: |
            Filter by whether the instance has at least one unresolved incident.
            Omit to return all instances regardless of incident status; pass
            `true` to show only instances that need operator attention; pass
            `false` to exclude blocked instances.
          schema:
            type: boolean
        - name: suspended
          in: query
          required: false
          description: |
            Filter by effective suspension - either scope counts. `true` → only
            instances paused at instance scope (`suspendedAt` set) or whose
            definition is paused (`definitionSuspended`); `false` → only
            instances paused at neither scope. Omit for no filter. Read those
            two row fields to tell the scopes apart; resume acts on one scope
            at a time.
          schema:
            type: boolean
        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Only return instances created at or after this timestamp. Strongly
            recommended for monitoring views - ended instances stay until
            retention deletes them, and unfiltered queries grow linearly with
            that history.
        - name: businessId
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Prefix match on the caller-supplied correlation key set at start time.
        - name: processId
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Only instances of this process id, in any version unless `version` names one.
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: Only instances of this version of `processId`. Ignored without `processId`.
        - name: draft
          in: query
          required: false
          description: |
            `true` keeps only test runs (see `StartBpmnTestInstance`), `false`
            leaves them out. Omit for both.
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the page before, absent for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Most instances per page, 20 by default and 100 at most.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnInstancePaginatedResponse'
    post:
      summary: Start a BPMN process instance
      operationId: StartBpmnInstance
      x-required-role: executor
      description: |
        Starts a new instance of a deployed BPMN process, the latest version
        unless the request names one. The returned `instanceID` addresses the
        instance - use it to fetch state, send signals/messages, complete user
        tasks, etc.

        A process with no deployed version, or without the requested one,
        answers 404, also when it exists in a resource that is not deployed yet.
        Drafts only start test instances, see `StartBpmnTestInstance`.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBpmnInstanceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceID:
                    type: string
                    description: Identifier of the new instance.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/bpmn/instances/{instanceID}:
    get:
      summary: Get BPMN instance state
      operationId: GetBpmnInstance
      x-required-role: viewer
      description: |
        Returns the runtime state of a process instance - current variables,
        active scopes, and any unresolved incidents. Its history is paged
        separately, see `GetBpmnInstanceHistory`.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnInstanceState'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Cancel a BPMN instance
      operationId: CancelBpmnInstance
      x-required-role: editor
      description: |
        Cancels a running instance and all of its active activities, jobs, and
        child instances. Cancellation is best-effort - handlers in flight may
        still complete before the cancel propagates. Cancelled instances move
        to status `CANCELED` and stop consuming further work.
        The cancel is recorded in the instance's history as a
        `CancelInstanceEvent` naming who cancelled it.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: The instance is a call-activity child of a running instance. Cancel the root instance instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No instance has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/instances/{instanceID}/children:
    get:
      summary: List child instances of a BPMN instance
      operationId: GetBpmnInstanceChildren
      x-required-role: viewer
      description: |
        Returns instances that this instance spawned via CallActivity elements.
        Useful for navigating into a multi-level process hierarchy (parents
        can be discovered via `parentInstanceID` on the child).
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnInstanceChildrenResponse'
  /projects/{projectID}/bpmn/instances/{instanceID}/variables:
    get:
      summary: Get BPMN instance variables
      operationId: GetBpmnInstanceVariables
      x-required-role: viewer
      description: Returns the current variables in the root scope of a running or completed instance.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    type: object
                    additionalProperties: true
                    x-go-type: VariableMap
    put:
      summary: Update BPMN instance variables
      operationId: UpdateBpmnInstanceVariables
      x-required-role: editor
      description: |
        Sets or replaces variables in the root scope of a running instance.
        The new values become visible to subsequent activities and FEEL
        expressions immediately. Existing variable keys not present in the
        payload are kept; pass `null` to clear a key.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
                  x-go-type: VariableMap
              required:
                - variables
      responses:
        '200':
          description: OK
  /projects/{projectID}/bpmn/instances/{instanceID}/history:
    get:
      summary: Get a page of a BPMN instance's history
      operationId: GetBpmnInstanceHistory
      x-required-role: viewer
      description: |
        A window of an instance's BPMN history, oldest first, for a running or
        an ended instance. Without a cursor it is the newest entries.
        `beforeSeq` reads the entries before one, to walk back, and `fromSeq`
        the entries from one on, to follow a running instance. Every entry
        carries its `seq`.

        Page entries leave out `inputs` and `outputs`, so a page costs the same
        however long the history is. Read one entry's payload from
        `GetBpmnInstanceHistoryEntry`. The diagram needs no history at all: the
        instance state's `elementStatistics` and `takenFlows` summarise it.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
        - name: fromSeq
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Read the entries from this seq on. Takes precedence over `beforeSeq`.
        - name: beforeSeq
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Read the newest entries before this seq.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max entries per page. Clamped server-side to the engine's max page size.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnHistoryPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectID}/bpmn/instances/{instanceID}/history/{seq}:
    get:
      summary: Get one BPMN history entry with its payload
      operationId: GetBpmnInstanceHistoryEntry
      x-required-role: viewer
      description: |
        One history entry with its `inputs` and `outputs`. The engine rebuilds
        them from the variable writes of every entry before it, so the read
        grows with the entry's position: around 0.3 s at entry 40,000.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnActivityState'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectID}/bpmn/instances/{instanceID}/incidents/{incidentID}/resolve:
    post:
      summary: Resolve an incident and retry the failed activity
      operationId: ResolveBpmnIncident
      x-required-role: editor
      description: |
        Marks an incident as resolved and re-runs the activity that produced it.
        Optional `variables` are merged into the activity's scope before retry -
        use this to fix the input that caused the failure (e.g. correct a value
        that triggered a FEEL evaluation error).
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
        - name: incidentID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
                  x-go-type: VariableMap
      responses:
        '200':
          description: OK
  /projects/{projectID}/bpmn/incidents:
    get:
      summary: List BPMN incidents
      operationId: ListBpmnIncidents
      x-required-role: viewer
      description: |
        Cross-instance audit listing of incidents in the project. By default
        returns open incidents first (unresolved), ordered by recency.
        Filterable by process version, error type, status, and time window.

        Each row carries the parent process metadata (processID, processName)
        so a single page render needs no follow-up queries against the
        instances endpoint. Click-through to a specific instance still uses
        the instance detail endpoint.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: processID
          in: query
          required: false
          description: Restrict to incidents on instances of one process, in any version unless `version` names one.
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Restrict to one version of `processID`. Ignored without `processID`.
          schema:
            type: integer
        - name: instanceID
          in: query
          required: false
          description: Restrict to incidents on a single instance - useful for an instance-detail "all incidents ever raised here" view that includes resolved rows. A test run's incidents list only by its instance.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: |
            Filter by lifecycle status. `open` returns unresolved incidents;
            `resolved` returns only resolved ones. Omit to return both.
          schema:
            type: string
            enum:
              - open
              - resolved
        - name: errorType
          in: query
          required: false
          description: Restrict to a single error category (matches `BpmnIncidentRecord.errorType`).
          schema:
            type: string
            enum:
              - BpmnError
              - CompensationError
              - FeelError
              - GatewayNoMatch
              - TimerResolution
              - LinkNotFound
              - MigrationError
              - CallActivityCanceled
              - ExternalRowRefreshError
              - JobLockLost
              - DecisionNotFound
              - DecisionEvaluationError
              - ProcessNotFound
              - ProcessSuspended
              - Unknown
        - name: since
          in: query
          required: false
          description: Earliest `raisedAt` to include (inclusive).
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Latest `raisedAt` to include (exclusive).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the page before, absent for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Most incidents per page, 20 by default and 100 at most.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnIncidentRecordPaginatedResponse'
  /projects/{projectID}/bpmn/instances/{instanceID}/migrate:
    post:
      summary: Migrate a running instance to a newer process version
      operationId: MigrateBpmnInstance
      x-required-role: editor
      description: |
        Moves a running instance from its current process version to a newer
        one. Element mappings tell the engine how to translate active tokens
        between versions; unmapped element ids must match by id between source
        and target. Validate the migration plan first via `MigrateValidate`.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateBpmnInstanceRequest'
      responses:
        '200':
          description: OK
  /projects/{projectID}/bpmn/instances/{instanceID}/migrate/validate:
    post:
      summary: Validate a migration plan without executing it
      operationId: ValidateBpmnInstanceMigration
      x-required-role: editor
      description: |
        Returns the issues a migration plan would hit if executed: missing
        mappings, incompatible element types, active boundary events that
        would be orphaned, etc. Run this before `Migrate` to surface problems
        to the user.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateBpmnInstanceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationValidationResult'
  /projects/{projectID}/bpmn/instances/{instanceID}/modify:
    post:
      summary: Modify a running instance with ad-hoc token operations
      operationId: ModifyBpmnInstance
      x-required-role: admin
      description: |
        Operational recovery tool: applies a sequence of token-level
        instructions (start before a node, cancel a token in a scope) to a
        running instance. Useful for unblocking instances that have ended up
        in unintended states. Restricted to project administrators.

        The instructions are validated against the live instance before
        anything is applied, and the whole batch is refused with a 400 if any
        of them cannot be: an unknown scope, a `START_BEFORE_NODE` naming a
        node the instance's process version does not contain, or a
        `CANCEL_TOKEN` with no live token, scope or incident at its target.
        A batch is applied whole or not at all.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyBpmnInstanceRequest'
      responses:
