  /projects/{projectID}/bpmn/external-jobs:
    get:
      summary: List external jobs
      operationId: ListBpmnExternalJobs
      x-required-role: viewer
      description: |
        Returns paginated external jobs in the project, with optional filters
        by `taskType`, `status`, and originating instance. The list holds the
        pending jobs and the finished jobs of running instances. An instance's
        jobs leave the list when it ends, and its history keeps each job's task
        type, retries left and worker. For pulling pending work as a job
        worker, use `Poll` instead.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskType
          in: query
          required: false
          schema:
            type: string
          description: Filter jobs by task type
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - COMPLETED
              - FAILED
              - CANCELED
          description: Filter jobs by status
        - name: instanceID
          in: query
          required: false
          schema:
            type: string
          description: Only this instance's jobs. A test run's jobs list only by its instance.
        - name: businessId
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Prefix match on the caller-supplied correlation key.
        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only return jobs created at or after this timestamp.
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the page before, absent for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Most jobs per page, 20 by default and 100 at most.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnExternalJobPaginatedResponse'
  /projects/{projectID}/bpmn/external-jobs/queue-depth:
    get:
      summary: PENDING job counts grouped by taskType
      description: |
        Returns one entry per `taskType` with at least one PENDING job. Useful for
        monitoring queue backlogs and capacity-planning external job workers.
      operationId: GetBpmnExternalJobsQueueDepth
      x-required-role: viewer
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only count jobs created at or after this timestamp. Should match the time-range selector used by the list endpoint so totals stay consistent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalJobQueueDepthResponse'
  /projects/{projectID}/bpmn/external-jobs/poll:
    post:
      summary: Poll for external jobs (long-poll)
      operationId: PollBpmnExternalJobs
      x-required-role: executor
      description: |
        Long-polls for PENDING jobs of a given `taskType`. Returns a batch of
        jobs (up to `maxJobs`) as soon as any are available, or `204 No Content`
        when the timeout elapses with no work. Each returned job is locked to
        the caller until `lockDuration` passes without a `Heartbeat`, and for at
        most the server's `ENGINE_JOB_MAX_HOLD` (30m by default) in total. Finish
        with `Complete` or `ThrowError`. A lock that runs out costs the job a
        retry, and with no retries left it raises an incident.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollBpmnJobRequest'
      responses:
        '200':
          description: One or more jobs acquired
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalJob'
        '204':
          description: No jobs available within timeout
        '400':
          description: An empty `clientID`, or a `lockDuration` or `timeout` that is not a Go duration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/external-jobs/{executionKey}/heartbeat:
    post:
      summary: Extend the lock on an acquired job
      operationId: HeartbeatBpmnExternalJob
      x-required-role: executor
      description: |
        Keeps the caller's lock on a job it acquired via `Poll` for another
        `lockDuration`, up to `ENGINE_JOB_MAX_HOLD` after the job was handed out.
        SDK workers send it at half of the lock the poll granted
        (`lockExpiresAt`) while a handler runs.
        Other workers cannot claim the job while the lock holds.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientID
              properties:
                clientID:
                  type: string
                lockDuration:
                  type: string
                  description: Duration string e.g. '30s', '2m'. Defaults to 30s.
      responses:
        '200':
          description: Lock extended
        '400':
          description: An empty `clientID`, or a `lockDuration` that is not a Go duration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No job has this execution key, or its instance has ended. Stop working on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            This worker no longer holds the job. Its lock ran out, another
            worker holds it, or the job has finished. Stop working on it. The
            message says when the job was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/external-jobs/{executionKey}/complete:
    post:
      summary: Complete an external job
      operationId: CompleteBpmnExternalJob
      x-required-role: executor
      description: |
        Finalizes an acquired external job successfully. The supplied
        `variables` are merged into the originating instance's scope and the
        process resumes after the service task. Idempotent on the executionKey:
        a second call with the same key after success is a no-op. Once the
        instance has ended, any report on its jobs answers 200 and changes
        nothing.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instanceID
              properties:
                instanceID:
                  type: string
                  description: Instance ID returned by the poll response.
                clientID:
                  type: string
                  description: |
                    Optional worker identity (the same `clientID` used to poll).
                    When supplied, a worker that no longer holds the job's lock
                    gets 409 and its result is discarded. Repeating the report
                    this worker last made on the job answers 200 again and changes
                    nothing. Without it, the completion applies to an open job no
                    worker holds a live lock on, as a completion from the console
                    does.
                variables:
                  type: object
                  additionalProperties: true
                  x-go-type: VariableMap
      responses:
        '200':
          description: OK
        '404':
          description: The instance is running and has no job with this execution key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The result was discarded. This worker no longer holds the job: its
            lock ran out, another worker holds or completed it, or the job
            failed or was cancelled. Without a `clientID`, a worker holds a live
            lock on the job, named in the message, or the job already ended. The
            message says when it was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/external-jobs/{executionKey}/error:
    post:
      summary: Fail an external job with a BPMN error code
      operationId: ThrowBpmnExternalJobError
      x-required-role: executor
      description: |
        Reports that the worker could not handle the job.

        The `retryable` flag decides how the failure is treated:

        * `retryable: true` (the default) - a **technical/transient** failure.
          If the job has remaining retries it is requeued for another attempt
          and the retry budget is decremented; the process is NOT notified. Only
          once retries are exhausted is the `errorCode` raised as a BPMN error,
          triggering any matching boundary error event on the originating service
          task (or an incident if none matches).
        * `retryable: false` - a **business** BPMN error. The `errorCode` is
          raised on the process immediately, bypassing the retry budget entirely,
          so a matching boundary error event fires (or an incident is raised)
          without wasting retries. Use this for domain outcomes a retry could
          never fix (e.g. `PAYMENT_DECLINED`). SDK workers send this automatically
          when a handler throws a typed `BpmnError`.

        Once the instance has ended, any report on its jobs answers 200 and
        changes nothing.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instanceID
                - errorCode
              properties:
                instanceID:
                  type: string
                  description: Instance ID returned by the poll response.
                errorCode:
                  type: string
                clientID:
                  type: string
                  description: |
                    Optional worker identity (the same `clientID` used to poll).
                    When supplied, a worker that no longer holds the job's lock
                    gets 409 and its report is discarded, so a stale report can't
                    requeue or fail the job. Repeating the report this worker last
                    made on the job answers 200 again and changes nothing. Without
                    it, the report applies to an open job no worker holds a live
                    lock on.
                retryable:
                  type: boolean
                  default: true
                  description: |
                    Whether this failure should consume the retry budget before
                    reaching the process. `true` (default) treats it as a
                    technical failure: requeue while retries remain, raise the
                    BPMN error only at exhaustion. `false` treats `errorCode` as a
                    business BPMN error and raises it immediately, bypassing
                    retries so a boundary error event fires (or an incident is
                    raised) at once. SDK workers set `false` for a handler-thrown
                    `BpmnError` and `true` for any other exception.
                variables:
                  type: object
                  additionalProperties: true
                  x-go-type: VariableMap
      responses:
        '200':
          description: OK
        '404':
          description: The instance is running and has no job with this execution key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The report was discarded. This worker no longer holds the job: its
            lock ran out, another worker holds it, or the job has finished.
            Without a `clientID`, a worker holds a live lock on the job, named in
            the message, or the job already ended. The message says when the job
            was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/external-jobs/batch/complete:
    post:
      summary: Complete External Jobs in Batch
      operationId: CompleteBpmnExternalJobsBatch
      x-required-role: executor
      description: |
        Completes a batch of external jobs in one request. Each item is
        delivered to its instance in parallel and per-item status is returned
        so a partial failure does not sink the whole batch.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                clientID:
                  type: string
                  description: |
                    Optional worker identity (the same `clientID` used to poll)
                    applied to every item in the batch - a batch is one worker's
                    report. When supplied, an item this worker no longer holds
                    comes back with status `error` and its result is discarded,
                    and repeating this worker's last report on an item changes
                    nothing. Without it, an item a worker holds a live lock on, or
                    one that already ended, comes back with status `error`.
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                      - executionKey
                      - instanceID
                    properties:
                      executionKey:
                        type: string
                      instanceID:
                        type: string
                      variables:
                        type: object
                        additionalProperties: true
                        x-go-type: VariableMap
      responses:
        '200':
          description: Per-item batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalJobBatchResponse'
  /projects/{projectID}/bpmn/external-jobs/batch/error:
    post:
      summary: Fail external jobs in batch
      operationId: ThrowBpmnExternalJobErrorsBatch
      x-required-role: executor
      description: |
        Reports a batch of worker failures in one request. With `retryable: true`
        (the default) each item's remaining retry budget decides whether it
        requeues for another attempt or surfaces its `errorCode` as a BPMN
        error/incident on the originating instance. With `retryable: false` every
        item is treated as a business BPMN error and raised immediately, bypassing
        the retry budget (see the single-job error endpoint for the full
        semantics). Per-item status is returned so a partial failure does not sink
        the whole batch.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                clientID:
                  type: string
                  description: |
                    Optional worker identity (the same `clientID` used to poll)
                    applied to every item in the batch - a batch is one worker's
                    report. When supplied, an item this worker no longer holds
                    comes back with status `error` and the job is left untouched,
                    and repeating this worker's last report on an item changes
                    nothing. Without it, an item a worker holds a live lock on, or
                    one that already ended, comes back with status `error`.
                retryable:
                  type: boolean
                  default: true
                  description: |
                    Applies to every item in the batch. `true` (default) consumes
                    each item's retry budget before raising its BPMN error; `false`
                    raises every item's `errorCode` as a business BPMN error
                    immediately, bypassing retries. See the single-job error
                    endpoint for the full semantics.
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                      - executionKey
                      - instanceID
                      - errorCode
                    properties:
                      executionKey:
                        type: string
                      instanceID:
                        type: string
                      errorCode:
                        type: string
                      variables:
                        type: object
                        additionalProperties: true
                        x-go-type: VariableMap
      responses:
        '200':
          description: Per-item batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalJobBatchResponse'
