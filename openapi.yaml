    post:
      summary: Resume a suspended BPMN instance
      operationId: ResumeBpmnInstance
      x-required-role: admin
      description: |
        Clears the instance-scope suspension. If the parent definition is also
        suspended the instance remains effectively paused until the definition
        is resumed as well. Idempotent.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /projects/{projectID}/bpmn/processes/{processID}/versions/{version}/suspend:
    post:
      summary: Suspend a deployed version of a BPMN process
      operationId: SuspendBpmnDefinition
      x-required-role: admin
      description: |
        Pauses every running instance of one deployed process version AND
        rejects new instance starts on that version until it is resumed.

        Instances that were also explicitly instance-suspended stay paused
        after a definition-scope resume - the operator must clear that scope
        too.

        Idempotent. Suspending again reaches the running instances an earlier
        call missed. The reason reaches every affected instance's history
        (`SuspendDefinitionEvent`) so the UI can render where the pause came
        from.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: processID
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendBpmnDefinitionRequest'
      responses:
        '204':
          description: No Content
        '404':
          description: Process version not found
  /projects/{projectID}/bpmn/processes/{processID}/versions/{version}/resume:
    post:
      summary: Resume a suspended version of a BPMN process
      operationId: ResumeBpmnDefinition
      x-required-role: admin
      description: |
        Clears the definition-scope suspension and resumes every running
        instance of the version. Instances that were also instance-suspended
        stay paused until their own scope is cleared. New instance starts are
        accepted again. Idempotent.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: processID
          in: path
          required: true
          schema:
            type: string
        - name: version
