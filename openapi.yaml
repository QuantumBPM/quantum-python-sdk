            type: string
            enum:
              - created
              - dueDate
              - priority
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the page before, absent for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Most tasks per page, 20 by default and 100 at most.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnUserTaskPaginatedResponse'
  /projects/{projectID}/bpmn/user-tasks/{executionKey}:
    get:
      summary: Get User Task
      operationId: GetBpmnUserTask
      x-required-role: viewer
      description: |
        Fetch a single user task by execution key. Allowed for callers with
        Executor (or higher) role on the project, OR for callers who are the
        task's assignee, listed in candidateUsers, or whose identity groups
        overlap candidateGroups - same access semantics as Complete and Error.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTask'
        '403':
          description: Forbidden - caller is not Executor and not assigned to the task
        '404':
          description: Not Found
    patch:
      summary: Update User Task Assignment
      operationId: UpdateBpmnUserTaskAssignment
      x-required-role: executor
      description: |
        Reassign / change candidates on a CREATED user task. Only the fields in
        the body change. Returns 400 for a body with none of them, and 404 if the
        task does not exist or is no longer in CREATED state. Requires Executor
        role on the project.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserTaskAssignmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Not Found
  /projects/{projectID}/bpmn/user-tasks/{executionKey}/complete:
    post:
      summary: Complete User Task
      operationId: CompleteBpmnUserTask
      x-required-role: viewer
      description: |
        Complete a user task with the given variables. Allowed for callers with
        Executor (or higher) role on the project, OR for callers who are the
        task's assignee, listed in candidateUsers, or whose identity groups
        overlap candidateGroups.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
                  x-go-type: VariableMap
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden - caller is not Executor and not assigned to the task
        '404':
          description: User task not found
        '409':
          description: |
            The task is no longer open: it was already completed or failed,
            possibly by another user a moment earlier, or it was cancelled.
            Nothing was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/user-tasks/{executionKey}/error:
    post:
      summary: Fail a user task with a BPMN error code
      operationId: ThrowBpmnUserTaskError
      x-required-role: viewer
      description: |
        Reports that the assignee could not complete the task. The `errorCode`
        is raised from the user-task node so any matching boundary error event
        can take over the failure path. Same access semantics as Complete.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - errorCode
              properties:
                errorCode:
                  type: string
                variables:
                  type: object
                  additionalProperties: true
                  x-go-type: VariableMap
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden - caller is not Executor and not assigned to the task
        '404':
          description: User task not found
        '409':
          description: |
            The task is no longer open: it was already completed or failed,
            possibly by another user a moment earlier, or it was cancelled.
            Nothing was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/messages:
    post:
      summary: Publish a BPMN message
      operationId: PublishBpmnMessage
      x-required-role: executor
      description: |
        Publishes a message into the project. Each message is delivered to at
        most one waiting catch event whose subscription matches `messageName`
        and whose correlation value equals `correlationKeys`. If no
        subscriber is currently waiting the message is buffered up to its TTL
        and delivered to the first matching subscriber that registers.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageName
              properties:
                messageName:
                  type: string
                  description: Name of the message, matched against catch-event subscriptions.
                correlationKeys:
                  $ref: '#/components/schemas/CorrelationKeys'
                variables:
                  type: object
                  description: Variables to pass into the receiving instance when the message is delivered.
                  additionalProperties: true
                  x-go-type: VariableMap
                ttl:
                  type: string
                  description: |
                    Optional time-to-live for the buffered message. Accepted
                    forms: ISO 8601 duration (`PT1H`, `P1DT12H`), Go duration
                    (`1h30m`), or RFC 3339 absolute timestamp
                    (`2026-12-31T23:59:59Z`). Omitted/empty applies the
                    server's 1-hour default.
      responses:
        '200':
          description: OK
        '400':
          description: |
            A message start event for `messageName` belongs to a suspended
            process definition, so the message would not start it. Nothing was
            published or buffered. Publish again once the definition is resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/signals:
    post:
      summary: Publish a BPMN signal
      operationId: PublishBpmnSignal
      x-required-role: executor
      description: |
        Publishes a signal into the project. Unlike messages, signals are
        broadcast: every catch event whose subscription matches `signalName`
        receives the signal. Published signals are buffered for 24 hours, so
        subscribers that register within that window also receive the signal
        (after that the buffered copy is purged).
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signalName
              properties:
                signalName:
                  type: string
                  description: Name of the signal, matched against catch-event subscriptions.
                variables:
                  type: object
                  description: Variables to pass into each receiving instance.
                  additionalProperties: true
                  x-go-type: VariableMap
                ttl:
                  type: string
                  description: |
                    How long the published signal stays buffered for late
                    subscribers. Accepted forms: ISO 8601 duration (`PT1H`,
                    `P1DT12H`), Go duration (`1h30m`), or RFC 3339 absolute
                    timestamp (`2026-12-31T23:59:59Z`). Omitted/empty applies
                    the server's 24-hour default.
      responses:
        '200':
          description: OK
        '400':
          description: |
            A signal start event for `signalName` belongs to a suspended process
            definition, so the signal would not start it. Nothing was published
            or buffered. Publish again once the definition is resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/processes:
    get:
      summary: List BPMN processes
      operationId: ListBpmnProcesses
      x-required-role: viewer
      description: |
        Returns one entry per unique process ID with aggregated counts of
        running and completed instances across all deployed versions. Use
        `ListBpmnProcessVersions` to drill into specific versions.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional case-insensitive substring match against process id or process name.
        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Bounds the totalCount aggregate to instances created at or after this
            timestamp. Strongly recommended for monitoring views - ended
            instances stay until retention deletes them, and unfiltered totals
            scan every kept instance per definition. runningCount ignores this filter (it is always
            point-in-time).
        - name: suspended
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Filter by paused versions. `true` → only processes with at least one
            paused version; `false` → only processes with none. Omit for no
            filter. This is the cross-process answer to "which definitions are
            paused?"; `suspendedVersionCount` on each row says how many.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnProcessSummaryPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/bpmn/processes/{processID}/versions:
    get:
      summary: List deployed versions of a BPMN process
      operationId: ListBpmnProcessVersions
      x-required-role: viewer
      description: |
        Returns each deployed version of a single process with its instance
        counts. Useful for picking the source/target version when migrating
        running instances.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: processID
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Bounds the totalCount aggregate to instances created at or after this
            timestamp. See ListBpmnProcesses for rationale. runningCount ignores
            this filter.
        - name: suspended
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Filter by definition-scope suspension. `true` → only paused versions;
            `false` → only active ones. Omit for no filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnProcessVersionPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/bpmn/processes/{processID}/versions/{version}:
    get:
      summary: Get one deployed version of a BPMN process
      operationId: GetBpmnProcessVersion
      x-required-role: viewer
      description: |
        Returns the single deployed version identified by (processID, version)
        with its instance counts and suspension state, wherever it falls in the
        pages of `ListBpmnProcessVersions`.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: processID
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Bounds the totalCount aggregate to instances created at or after this
            timestamp. See ListBpmnProcesses for rationale. runningCount ignores
            this filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnProcessVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    FeelNumber:
      type: number
      description: FEEL number. Maps to a decimal value at runtime. Exact decimal semantics end-to-end - the Go types use json.Number so values are never narrowed through float64.
      x-go-type: json.Number
    FeelString:
      type: string
      description: FEEL string. Date, time, and duration values are also represented as strings using the FEEL textual forms (e.g. `"2026-01-31"`, `"PT1H"`).
    FeelBoolean:
      type: boolean
      description: FEEL boolean.
    FeelValue:
      description: A FEEL-typed value as it appears in DMN inputs and outputs. May be a number, string, boolean, list, or nested context.
      oneOf:
        - $ref: '#/components/schemas/FeelNumber'
        - $ref: '#/components/schemas/FeelString'
        - $ref: '#/components/schemas/FeelBoolean'
        - $ref: '#/components/schemas/FeelList'
        - $ref: '#/components/schemas/FeelContext'
      nullable: true
    FeelList:
      type: array
      description: FEEL list. Lists may contain mixed types.
      items:
        $ref: '#/components/schemas/FeelValue'
    FeelContext:
      type: object
      description: FEEL context (a name → value map). The DMN equivalent of an object.
      additionalProperties:
        $ref: '#/components/schemas/FeelValue'
    ErrorMode:
      type: string
      description: |
        How the evaluation reacts to FEEL errors and failing decisions (DMN 1.5, section 7.3.8):
          * `strict` - the evaluation stops at the first error and the call reports it, with the
            line and column where the failing part of the expression starts.
          * `lenient` - a FEEL runtime error such as `string length(null)` makes only that part of
            the expression `null` and is listed in the `warnings` of the decision's result. A
            decision that still fails evaluates to `null` and carries its message in the `error`
            field of its own result, while the decisions around it keep evaluating.
        Omit it to use the mode the server is configured with.
      enum:
        - strict
        - lenient
    FeelWarning:
      type: object
      description: A FEEL runtime error that lenient mode replaced with `null`.
      required:
        - message
      properties:
        message:
          type: string
          description: 'What failed, for example `string length: argument cannot be null`.'
        line:
          type: integer
          description: Line in the expression where the failing part starts. Absent when unknown.
        column:
          type: integer
          description: Column in the expression where the failing part starts. Absent when unknown.
    HitRule:
      type: object
      description: A single rule that matched during decision-table evaluation.
      properties:
        ruleID:
          type: string
          description: ID of the matched rule from the DMN XML.
        outputs:
          $ref: '#/components/schemas/FeelValue'
    EvaluationResult:
      type: object
      description: Result of evaluating a single decision (or decision service / BKM / input data) within a DMN evaluation.
      properties:
        decisionID:
          type: string
          description: ID of the decision element from the DMN XML.
        decisionVersion:
          type: integer
          description: |
            The decision's version, counted per decision id. Present on a decision of a deployed
            definition, absent on a draft evaluation.
        name:
          type: string
          description: Human-readable name of the decision.
        error:
          type: string
          description: Error message if the decision failed to evaluate. Null on success.
          nullable: true
        warnings:
          type: array
          description: FEEL runtime errors that lenient mode replaced with `null` while this decision was evaluated. Absent when there were none.
          items:
            $ref: '#/components/schemas/FeelWarning'
        type:
          type: string
          description: |
            Kind of DMN element that produced this result:
              * `DECISION` - a decision node, the typical case.
              * `DECISION_SERVICE` - a decision service that aggregates multiple decisions.
              * `BKM` - a business knowledge model (reusable invocable logic).
              * `INPUT_DATA` - an input variable, included for context, not evaluated.
          enum:
            - DECISION
            - DECISION_SERVICE
            - BKM
            - INPUT_DATA
        value:
          $ref: '#/components/schemas/FeelValue'
        hitRules:
          type: array
          description: For decision tables, the rules that matched. Empty for other decision logic.
          items:
            $ref: '#/components/schemas/HitRule'
        dependencies:
          type: array
          description: Results of upstream decisions this decision required. Useful for tracing evaluation paths.
          items:
            $ref: '#/components/schemas/EvaluationResult'
    Error:
      type: object
      description: A standard error response. The HTTP status code carries the broad category; `code` is the machine-readable identifier within that category.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Machine-readable error category. Values:
              * `BAD_REQUEST` - request is malformed or fails validation.
              * `UNAUTHORIZED` - request lacks or has an invalid authentication token.
              * `FORBIDDEN` - caller is authenticated but lacks permission.
              * `NOT_FOUND` - the addressed resource does not exist.
              * `CONFLICT` - the request collides with the resource's current state, such as reporting on a job this worker no longer holds.
              * `UNAVAILABLE` - the resource cannot answer right now, such as while the engine's database is unreachable. Try again shortly.
              * `INTERNAL_ERROR` - unexpected server-side failure.
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable description of the failure.
        details:
          type: object
          description: Optional structured context (e.g. the field that failed validation, the limit that was exceeded). Shape is per-error and not generally guaranteed.
          additionalProperties: true
    BatchEvaluateDesignRequest:
      type: object
      description: Payload for batch evaluating ad-hoc DMN XML against multiple input rows.
      properties:
        xml:
          type: string
          description: DMN XML to evaluate.
        inputs:
          type: array
          description: One input context per row to evaluate. At most 500 rows per request.
          maxItems: 500
          items:
            $ref: '#/components/schemas/FeelContext'
        errorMode:
          $ref: '#/components/schemas/ErrorMode'
    BatchEvaluationResponse:
      type: object
      description: Per-row results from a batch evaluation.
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              executionID:
                type: string
                description: Identifier assigned to this row's evaluation, useful for correlating with logs.
              inputs:
                type: object
                description: The input row that produced these results, echoed for convenience.
                additionalProperties: true
              results:
                type: object
                description: Evaluation results keyed by decision name.
                additionalProperties:
                  $ref: '#/components/schemas/EvaluationResult'
    Project:
      type: object
      description: A workspace that groups DMN definitions and BPMN processes together for access control and execution.
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique project identifier.
        name:
          type: string
          description: Human-readable project name.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the project was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last modification.
    Definition:
      type: object
      description: A saved DMN definition, a draft until it is deployed.
      required:
        - id
        - name
        - definitionsID
        - xml
        - isDeployed
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Platform identifier of this saved definition.
        name:
          type: string
          description: Human-readable name displayed in the UI.
        definitionsID:
          type: string
          description: Stable identifier from the DMN XML's outer `<definitions id="…">` attribute. Shared across the definitions saved for one model.
        xml:
          type: string
          description: The DMN XML body.
        isDeployed:
          type: boolean
          description: True once the definition is deployed, which makes it read-only and its decisions evaluable.
        version:
          type: integer
          description: The version its deploy gave it, counted per `definitionsID`. Absent on a draft.
        deployedAt:
          type: string
          format: date-time
          description: Timestamp of the deploy. Absent on a draft.
        createdBy:
          type: string
          description: User who saved this definition.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of the last save.
        versionCount:
          type: integer
          description: How many definitions are saved under this `definitionsID`. Populated by the latest-listing endpoint and absent on single reads.
    PaginationMetadata:
      type: object
      description: Pagination metadata accompanying paginated list responses.
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: Current page number (1-indexed).
        pageSize:
          type: integer
          description: Number of items per page.
        total:
          type: integer
          description: Total number of items across all pages.
        totalPages:
          type: integer
          description: Total number of pages.
    PaginatedDefinitionsResponse:
      type: object
      description: Page of DMN definition versions.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    CreateDefinitionRequest:
      type: object
      description: Payload for saving a new draft DMN definition.
      required:
        - name
        - xml
      properties:
        name:
          type: string
          description: Display name.
        xml:
          type: string
          description: DMN XML body.
    EvaluateStoredRequest:
      type: object
      description: Payload for evaluating a deployed DMN definition.
      required:
        - context
      properties:
        version:
          type: integer
          description: |
            Deployed version to evaluate, the latest when omitted. The `version` query parameter does
            the same, and a request giving both with different values is rejected.
        context:
          $ref: '#/components/schemas/FeelContext'
        errorMode:
          $ref: '#/components/schemas/ErrorMode'
        decisionServices:
          type: array
          items:
            type: string
          description: Names of decision services to evaluate. When given, `decisions` is ignored.
        decisions:
          type: array
          items:
            type: string
          description: Names of decisions or decision services to evaluate. If empty, all decisions are evaluated.
        businessId:
          type: string
          maxLength: 255
          description: Optional caller-supplied correlation key recorded with the evaluation for cross-system tracing.
    UpdateDefinitionRequest:
      type: object
      description: Payload for changing a draft DMN definition.
      properties:
        xml:
          type: string
          description: Replacement XML. The `definitionsID` is read from its `<definitions id>`, falling back to the original.
        name:
          type: string
          description: New display name.
    DecisionInputField:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Variable name the decision expects as input
        typeRef:
          type: string
          description: DMN typeRef (e.g. string, number, boolean) when declared
    DecisionSummary:
      type: object
      description: A unique decision in the project, surfaced for picking from BPMN BusinessRuleTask elements.
      required:
        - decisionID
        - decisionName
        - definitionsID
        - definitionName
        - latestVersion
        - inputFields
      properties:
        decisionID:
          type: string
          description: ID of the decision node from the DMN XML (unique per project).
        decisionName:
          type: string
          description: Human-readable name of the decision.
        definitionsID:
          type: string
          description: Stable identifier from the DMN XML's outer `<definitions id="…">` attribute.
        definitionName:
          type: string
          description: Human-readable name of the DMN definition the latest version came from.
        latestVersion:
          type: integer
          description: The decision's latest deployed version, counted per decision id. A business rule task that binds a version names this number.
        inputFields:
          type: array
          description: Declared input variables of the decision (from DMN `InformationRequirement` → `InputData`). Useful for prepopulating BPMN BusinessRuleTask input mappings. Empty when the decision declares no typed inputs.
          items:
            $ref: '#/components/schemas/DecisionInputField'
    PaginatedDecisionsResponse:
      type: object
      description: Page of decisions.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DecisionSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    DecisionVersion:
      type: object
      description: A deployed version of a decision.
      required:
        - version
        - definitionsID
        - definitionVersion
        - deployedAt
      properties:
        version:
          type: integer
          description: The decision's version, counted per decision id.
        decisionName:
          type: string
          description: Human-readable name of the decision in this version.
        definitionsID:
          type: string
          description: Stable identifier of the DMN definition this version came from.
        definitionVersion:
          type: integer
          description: The deployed version of that DMN definition.
        deployedAt:
          type: string
          format: date-time
          description: When that DMN definition version was deployed.
    DecisionVersionList:
      type: object
      description: A decision's deployed versions, the latest first.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DecisionVersion'
    Execution:
      type: object
      description: |
        A recorded evaluation of a deployed DMN definition, by `EvaluateByDefinitionsID` or by a
        business rule task. A business rule task's names its instance, task and decision.
      required:
        - id
        - definitionsID
        - version
        - executedAt
        - inputs
        - outputs
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of this evaluation.
        definitionsID:
          type: string
          description: The DMN XML's `<definitions id="…">` value.
        version:
          type: integer
          description: The deployed version of `definitionsID` that was evaluated.
        decisionID:
          type: string
          description: The decision a business rule task called. Absent on an evaluation through the API.
        decisionVersion:
          type: integer
          description: The version of `decisionID` the business rule task called. Absent on an evaluation through the API.
        instanceID:
          type: string
          description: The process instance of the business rule task. Absent on an evaluation through the API.
        nodeID:
          type: string
          description: The business rule task's element id. Absent on an evaluation through the API.
        executedAt:
          type: string
          format: date-time
          description: Timestamp when the evaluation ran.
        executedBy:
          type: string
          description: User or service account that issued the evaluation. Absent on a business rule task's.
        inputs:
          $ref: '#/components/schemas/FeelContext'
        outputs:
          type: object
          description: Each evaluated decision's result, by decision name.
          additionalProperties:
            $ref: '#/components/schemas/EvaluationResult'
        businessId:
          type: string
          description: Caller-supplied correlation key passed at evaluation time (REST) or inherited from the parent BPMN process (business rule task).
    PaginatedExecutionsResponse:
      type: object
      description: Page of recorded DMN executions.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    BpmnResource:
      type: object
      description: A version of a BPMN resource (XML file containing one or more processes).
      required:
        - id
        - name
        - xml
        - definitionsID
        - isDeployed
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Platform identifier for this specific resource version.
        name:
          type: string
          description: Display name.
        xml:
          type: string
          description: BPMN XML body.
        definitionsID:
          type: string
          description: Stable identifier from the BPMN XML's outer `<definitions id="…">` attribute. Shared across versions.
        isDeployed:
          type: boolean
          description: True once the resource has been deployed and its processes are available to start instances.
        deployedAt:
          type: string
          format: date-time
          description: Timestamp when the resource was deployed. Empty for drafts.
        createdBy:
          type: string
          description: User who uploaded this version.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this version was uploaded.
        hasSuspendedDefinition:
          type: boolean
          description: |
            True when at least one process definition inside this resource version
            is paused. Populated on list endpoints; absent on single-resource
            reads, where the per-process `suspendedAt` is the precise answer.
    BpmnResourcePaginatedResponse:
      type: object
      description: Page of BPMN resource versions.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BpmnResource'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    CreateBpmnResourceRequest:
      type: object
      description: Payload for uploading a BPMN resource version.
      required:
        - name
        - xml
      properties:
        name:
          type: string
          description: Display name.
        xml:
          type: string
          description: BPMN XML body.
    BpmnProcessDefinition:
      type: object
      description: A deployed process version from a BPMN resource. `processID` and `version` address it.
      required:
        - resourceID
        - processID
        - version
        - createdAt
      properties:
        resourceID:
          type: string
          format: uuid
          description: Platform identifier of the owning BPMN resource.
        processID:
          type: string
          description: BPMN `id` attribute on the `<process>` element.
        processName:
          type: string
          description: Human-readable name from the BPMN XML.
        version:
          type: integer
          description: Process version. Auto-incremented per `processID` on deploy.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this version became available.
        deployedBy:
          type: string
          description: User or service account that deployed this version.
        suspendedAt:
          type: string
          format: date-time
          description: Timestamp at which this process definition was paused. Empty when active.
        suspendReason:
          type: string
          description: Free-text reason captured at suspend time.
    BpmnResourceDetail:
      description: A BPMN resource together with the parsed processes it contains.
      allOf:
        - $ref: '#/components/schemas/BpmnResource'
        - type: object
          properties:
            processes:
              type: array
              description: Parsed processes inside the resource. Empty for resources whose XML has not been deployed yet.
              items:
                $ref: '#/components/schemas/BpmnProcessDefinition'
    StartBpmnTestInstanceRequest:
      type: object
      description: Payload for starting a non-deployed BPMN process instance against a draft resource for testing.
      properties:
        processID:
          type: string
          description: BPMN process ID (the `id` attribute on `<bpmn:process>`) to start. Defaults to the first executable process in the resource.
        variables:
          type: object
          description: Initial process variables.
          additionalProperties: true
          x-go-type: VariableMap
        businessId:
          type: string
          maxLength: 255
          description: Optional caller-supplied correlation key.
    BpmnResourceSummary:
      type: object
      description: One entry per BPMN definitionsID showing the latest version's metadata.
      required:
        - definitionsID
        - latestResourceID
        - name
        - versionCount
        - isDeployed
        - createdAt
      properties:
        definitionsID:
          type: string
          description: Stable BPMN definitions identifier.
        latestResourceID:
          type: string
          format: uuid
          description: Platform identifier of the latest resource version under this `definitionsID`.
        name:
          type: string
          description: Display name from the latest version.
        versionCount:
          type: integer
          description: Total number of stored versions for this `definitionsID`.
        isDeployed:
          type: boolean
          description: Whether the latest version is deployed.
        hasSuspendedDefinition:
          type: boolean
          description: |
            True when any version under this `definitionsID` contains a paused
            process definition - including older versions, since a pause on a
            superseded version is exactly what's hard to find otherwise.
        createdAt:
          type: string
          format: date-time
          description: Upload timestamp of the latest version.
    BpmnResourceSummaryPaginatedResponse:
      type: object
      description: Page of BPMN resource summaries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BpmnResourceSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    ValidateBpmnResourceRequest:
      type: object
      description: Payload for the BPMN XML validator.
      required:
        - xml
      properties:
        xml:
          type: string
          description: BPMN XML to validate.
    BpmnValidationIssue:
      type: object
      description: A single validation finding produced while parsing BPMN XML.
      required:
        - severity
        - message
      properties:
        severity:
          type: string
          description: Severity of the issue. `error` blocks deploy; `warning` is informational.
          enum:
            - error
            - warning
        elementID:
          type: string
          description: ID of the BPMN element the issue is about. Empty for issues that aren't tied to a specific element.
        message:
          type: string
          description: Human-readable description of the issue.
    BpmnValidateResponse:
      type: object
      description: Result of validating BPMN XML, separated into blocking errors and informational warnings.
      required:
        - errors
        - warnings
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BpmnValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/BpmnValidationIssue'
    BpmnInstanceStatus:
      type: string
      description: Current lifecycle status of the instance.
      enum:
        - RUNNING
        - COMPLETED
        - FAILED
        - CANCELED
        - TERMINATED
    BpmnInstance:
      type: object
      description: A running or completed execution of a BPMN process.
      required:
        - instanceID
        - processId
        - processVersion
        - status
        - createdAt
      properties:
        instanceID:
          type: string
          description: Identifier of this instance. Use it to address the instance in all API calls - fetch state, send signals/messages, complete user tasks, list children, cancel, etc.
        parentInstanceID:
          type: string
          description: Identifier of the parent instance that started this one via a CallActivity. Empty for top-level instances.
        status:
          $ref: '#/components/schemas/BpmnInstanceStatus'
        startedBy:
          type: string
          description: User or service account that initiated the instance.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the instance was started.
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the instance reached a terminal status. Empty while running.
        hasIncident:
          type: boolean
          description: True when at least one unresolved incident is currently attached to this instance. Computed at query time against the open-incidents index - useful for rendering a "needs attention" indicator in instance lists without paying for a per-row state fetch from the engine.
        draft:
          type: boolean
          description: True for a test run, see `StartBpmnTestInstance`.
        suspendedAt:
          type: string
          format: date-time
          description: |
            Timestamp at which this instance was paused at INSTANCE scope. Empty
            when not instance-suspended. The instance may still be effectively
            suspended via its definition - see `definitionSuspended`.
        suspendedBy:
          type: string
          description: Operator who suspended this instance (instance scope). Empty when not instance-suspended.
        suspendReason:
          type: string
          description: Free-text reason captured at suspend time.
        definitionSuspended:
          type: boolean
          description: |
            True when the process definition this instance runs is paused. Token
            dispatch stops while either scope is set, so an instance is
            effectively paused if this is true or `suspendedAt` is present. The
            two stay separate because resume acts on one scope at a time.
        parentSuspended:
          type: boolean
          description: |
            True when an instance above this running call-activity child in the
            call chain is paused, which pauses this one too. It clears when that
            instance is resumed.
        businessId:
          type: string
          description: Caller-supplied correlation key set when the instance was started. Inherited unchanged on child instances spawned via CallActivity.
        processId:
          type: string
          description: BPMN process ID of the definition this instance was started from. Together with `processVersion` it addresses the version.
        processName:
          type: string
          description: Human-readable name of that process definition.
        processVersion:
          type: integer
          description: Version of the process definition this instance was started from. 0 on a test run, which runs no deployed version.
    CursorPage:
      type: object
      description: |
        Where a list paged by cursor stands. Pass `nextCursor` back as `cursor`
        for the next page. It is absent on the last page. `total` counts the
        matches on the first page only, the one read without a cursor, and stops
        at 10,000, which `totalCapped` reports.
      properties:
        nextCursor:
          type: string
        total:
          type: integer
        totalCapped:
          type: boolean
    BpmnInstancePaginatedResponse:
      type: object
      description: Page of BPMN process instances.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BpmnInstance'
        pagination:
          $ref: '#/components/schemas/CursorPage'
    StartBpmnInstanceRequest:
      type: object
      description: Payload for starting a new BPMN process instance.
      required:
        - processID
      properties:
        processID:
          type: string
          description: BPMN process ID of a deployed process to start.
        version:
          type: integer
          description: Deployed version to start. Omit for the latest version.
        variables:
          type: object
          description: Initial process variables. Available to FEEL expressions and service tasks from the first activity onward.
          additionalProperties: true
          x-go-type: VariableMap
        businessId:
          type: string
          maxLength: 255
          description: Optional caller-supplied correlation key (order number, ticket ID, etc.) indexed for filtering and stamped on every child instance, external job, user task, and DMN execution emitted by this process.
    BpmnIncident:
      type: object
      description: An error that halted execution of a BPMN node and requires manual resolution.
      properties:
        incidentID:
          type: string
          description: Unique identifier of this incident.
        nodeID:
          type: string
          description: ID of the BPMN node where the error occurred.
        scopeID:
          type: string
          description: ID of the scope in which the error occurred.
        executionKey:
          type: string
          description: Execution key of the activity that failed.
        parentScopeID:
          type: string
          description: ID of the scope containing `scopeID`, empty for the root scope. Scope IDs are opaque, so this is how a client walks a failure back up the process tree.
        miIndex:
          type: integer
          description: Zero-based multi-instance body index when the failure happened inside one iteration of a multi-instance activity. Absent otherwise.
        errorMessage:
          type: string
          description: Human-readable description of the error.
        errorCode:
          type: string
          description: BPMN error code from the process definition; empty for non-BPMN errors.
        errorType:
          type: string
          description: |
            Category of the error. Values:
              * `BpmnError` - A `bpmn:error` thrown by the process or an external job worker.
              * `CompensationError` - Failure during compensation handler execution.
              * `FeelError` - A FEEL expression failed to evaluate.
              * `GatewayNoMatch` - An exclusive gateway evaluated all conditions to false with no default flow.
              * `TimerResolution` - A timer expression could not be parsed or resolved.
              * `LinkNotFound` - A link throw event has no matching link catch.
              * `MigrationError` - A process instance migration could not be applied.
              * `CallActivityCanceled` - A call-activity child terminated as Canceled out-of-band.
              * `ExternalRowRefreshError` - A migration could not rewrite a parked wait's external row (job, user task or subscription) against the target definition. Resolving re-runs the refresh.
              * `JobLockLost` - An external job's worker lock ran out, by missed heartbeats or the maximum hold, with no retries left.
              * `DecisionNotFound` - A business rule task called a decision, or a pinned version of one, that is not deployed.
              * `DecisionEvaluationError` - The decision a business rule task called failed while it was evaluated, such as a FEEL error or a violated hit policy. The failed evaluation is recorded.
              * `ProcessNotFound` - A call activity called a process, or a pinned version of one, that is not deployed.
              * `ProcessSuspended` - A call activity called a suspended process version.
              * `Unknown` - Internal error not classified above.
          enum:
            - BpmnError
            - CompensationError
            - FeelError
            - GatewayNoMatch
            - TimerResolution
            - LinkNotFound
            - MigrationError
            - CallActivityCanceled
            - ExternalRowRefreshError
            - JobLockLost
            - DecisionNotFound
            - DecisionEvaluationError
            - ProcessNotFound
            - ProcessSuspended
            - Unknown
        variables:
          type: object
          description: Variables in scope at the time of the error.
          additionalProperties: true
          x-go-type: VariableMap
        raisedAt:
          type: string
          format: date-time
          description: When the incident was raised.
    ActiveScope:
      type: object
      description: A scope (sub-process, multi-instance body, or root process) that currently holds at least one live execution token.
      properties:
        scopeID:
          type: string
          description: Unique identifier of this scope instance.
        parentScopeID:
          type: string
          description: ID of the parent scope, empty for the root scope.
        nodeID:
          type: string
          description: ID of the BPMN element that created this scope (e.g. a sub-process node). Empty for the root scope.
        activeNodes:
          type: object
          description: 'Live token count per flow node in this scope, keyed by node ID. A node can hold more than one token at a time (a parallel fork whose branches re-converge without a join, a non-interrupting boundary handler, a loop edge re-entering a node a prior token has not left yet), so the count matters: a presence-only list cannot tell one token from five. Absent keys mean no live token.'
          additionalProperties:
            type: integer
        processVersion:
          type: integer
          description: Version of the process definition active in this scope.
        variables:
          type: object
          description: Variables scoped to this instance, excluding inherited parent-scope variables.
          additionalProperties: true
          x-go-type: VariableMap
    SuspensionEntry:
      type: object
      description: |
        Audit-shaped record of an active suspension at one scope (instance or
        definition). Returned inline on `BpmnInstanceState` - `null` when not
        suspended at that scope. An instance is "effectively suspended" if either
        scope's entry is present; the dispatcher pauses forward token dispatch
        while either flag is set.
      required:
        - suspendedAt
      properties:
        suspendedAt:
          type: string
          format: date-time
          description: When the suspension was applied.
        suspendedBy:
          type: string
          description: Identifier of the operator (or service account) that initiated the suspension.
        reason:
          type: string
          description: Free-text reason captured at suspend time; surfaces in the operator UI alongside the action.
    JoinArrivals:
      type: object
      description: The flows that have delivered tokens to a join that has not fired yet.
      required:
        - nodeId
        - scopeId
        - incomingFlows
      properties:
        nodeId:
          type: string
        scopeId:
          type: string
        incomingFlows:
          type: array
          items:
            type: string
    BpmnElementStatistics:
      type: object
      description: What an instance's history recorded for one element.
      properties:
        completed:
          type: integer
          description: Times the element completed.
        failed:
          type: integer
          description: Times the element failed.
        canceled:
          type: integer
          description: Times the element was canceled.
        lastStatus:
          type: string
          description: The element's latest Completed, Failed, Canceled or Resolved entry.
          enum:
            - Completed
            - Failed
            - Canceled
            - Resolved
        childInstanceID:
          type: string
          description: For a call activity, the child its latest execution started.
    BpmnInstanceState:
      type: object
      description: Full runtime state of a BPMN process instance.
      required:
        - instanceID
      properties:
        resourceID:
          type: string
          format: uuid
          description: ID of the BPMN resource the instance's process version was deployed from. Empty for a version deployed from no resource.
        instanceID:
          type: string
          description: Identifier of this instance.
        parentInstanceID:
          type: string
          description: Identifier of the parent instance that started this one via a CallActivity. Empty for top-level instances.
        startedBy:
          type: string
          description: User or service account that started the instance. For an instance a message or signal started, its publisher. Empty for a timer start or a call-activity child.
        processId:
          type: string
          description: BPMN process definition ID this instance was started from.
        processVersion:
          type: integer
          description: Version of the BPMN process definition this instance is currently running. Updated by migration operations.
        status:
          $ref: '#/components/schemas/BpmnInstanceStatus'
        variables:
          type: object
          description: All variables currently in scope for the root process.
          additionalProperties: true
          x-go-type: VariableMap
        error:
          type: boolean
          description: True when the instance failed or has an unresolved incident.
        draft:
          type: boolean
          description: |
            True for a test run, see `StartBpmnTestInstance`. Messages and signals
            reach it under their names with the `draft:` prefix.
        incidents:
          type: array
          description: |
            Active incidents that require resolution before the process can
            continue. Empty once the instance has finished: the incident list keeps
            each one with `resolvedBy` set to `system:<status>`.
          items:
            $ref: '#/components/schemas/BpmnIncident'
        activeScopes:
          type: array
          description: Scopes that currently hold at least one live token.
          items:
            $ref: '#/components/schemas/ActiveScope'
        failureReason:
          type: string
          description: Error message of the instance when status is FAILED.
        instanceSuspension:
          $ref: '#/components/schemas/SuspensionEntry'
          description: |
            Present when this instance has been explicitly suspended by an
            operator. Clear via the resume instance endpoint. Composes with
            `definitionSuspension` - both must be null for the instance to
            dispatch tokens.
        definitionSuspension:
          $ref: '#/components/schemas/SuspensionEntry'
          description: |
            Present when the instance's process definition has been suspended.
            Clear via the resume definition endpoint (the backend fans out to
            every running instance of the definition).
        parentSuspension:
          $ref: '#/components/schemas/SuspensionEntry'
          description: |
            Present on a call-activity child while an instance above it in the
            call chain is suspended, carrying that suspension. It clears when that
            instance is resumed. A suspension of the child itself stays until the
            child is resumed.
        pendingJoinArrivals:
          type: array
          items:
            $ref: '#/components/schemas/JoinArrivals'
          description: Joins still waiting to fire, with the flows that have reached them.
        elementStatistics:
          type: object
          description: The whole history summarised per element ID, so a diagram can show what each element did without reading the history.
          additionalProperties:
            $ref: '#/components/schemas/BpmnElementStatistics'
        takenFlows:
          type: array
          description: Sequence flows a token has taken, by flow ID.
          items:
            type: string
        businessId:
          type: string
          description: Caller-supplied correlation key set when the instance was started.
    BpmnInstanceChildrenResponse:
      type: object
      description: Child instances spawned by a parent instance via CallActivity elements.
      required:
        - children
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/BpmnInstance'
    BpmnActivityState:
      type: object
      description: Execution record for a single BPMN activity (service task, user task, gateway, etc.).
      properties:
        seq:
          type: integer
          format: int64
          description: Position of the entry in the instance's history, from 1.
        nodeID:
          type: string
          description: ID of the BPMN flow node.
        nodeType:
          type: string
          description: Type of the BPMN node (e.g. ServiceTask, UserTask, ExclusiveGateway).
        status:
          type: string
          description: Execution outcome - Started, Completed, Failed, Canceled, or Resolved. `Resolved` replaces `Failed` once the originating incident is removed (retry, modification-cancel, boundary catch); the entry's `errorMessage` is preserved so the failed attempt remains auditable.
          enum:
            - Started
            - Completed
            - Failed
            - Canceled
            - Resolved
        startTime:
          type: string
          format: date-time
          description: When the element started. Each entry records one event, so a Started entry carries it and a Completed, Failed, Canceled or Resolved entry leaves it out. An entry for an operation, such as a suspension or a migration, carries both times. Entries are ordered by `seq`, not by time.
        endTime:
          type: string
          format: date-time
          description: When the element ended. Absent on a Started entry.
        inputs:
          type: object
          description: Input variables evaluated at activity entry. Absent on history page entries.
          additionalProperties: true
          x-go-type: VariableMap
        outputs:
          type: object
          description: Output variables produced by the activity. Absent on history page entries.
          additionalProperties: true
          x-go-type: VariableMap
        errorMessage:
          type: string
          description: Failure reason on Failed / Canceled / Resolved entries. Empty on success paths.
        errorCode:
          type: string
          description: BPMN `errorCode` of the throw error that caused the failure. Set on Failed/Resolved entries originating from a BPMN error; empty for non-BPMN failures. Error variables (if any) ride on `outputs` since a Failed entry doesn't otherwise produce outputs.
        executionKey:
          type: string
          description: Key of the element's execution, the same on its Started and its ending entry. Absent for an element that runs no execution, such as a start or end event.
        actor:
          type: string
          description: 'User or service account whose call produced this entry: the completion of a job or user task, the publish of a message or signal a catch took, a start, a resolve, a suspension or a cancel. Empty for an entry the engine produced on its own.'
        taskType:
          type: string
          description: Task type of the external job this entry ended, on the Completed, Failed or Canceled entry of a job's element. Empty otherwise.
        retries:
          type: integer
          description: Retries the external job had left when a worker or a lock expiry reported its outcome. Absent on a job the engine canceled.
        worker:
          type: string
          description: '`clientID` of the worker that reported the external job''s outcome, or whose lock ran out. Empty when no worker was named.'
        childInstanceID:
          type: string
          description: For CallActivity nodes, the identifier of the child instance spawned by this execution. Empty for non-CallActivity nodes.
        incomingFlows:
          type: array
          items:
            type: string
          description: IDs of the sequence flows that brought the token to this element, on its first entry (Started, or Completed for an element without duration). A join firing lists every flow it consumed, a join cancelled before it fired lists the flows that had reached it. A flow is taken when some entry lists it, together with `pendingJoinArrivals` on the instance state.
    BpmnHistoryPage:
      type: object
      description: |
        A window of an instance's BPMN history, oldest first. Its entries carry
        no `inputs` or `outputs`. `total` is the entry count at the time of the
        call, which is also the newest entry's `seq`. It grows while the
        instance runs. New entries never reorder earlier ones.
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BpmnActivityState'
        total:
          type: integer
          format: int64
          description: Number of history entries at the time of the call.
    BpmnIncidentRecord:
      type: object
      description: |
        A persisted incident - the cross-instance audit row that backs the
        "Incidents" view. The same incident is also available in
        `BpmnInstanceState.incidents` while it is open and the instance runs. The
        persisted row additionally carries `raisedAt` / `resolvedAt` /
        `resolvedBy` and the parent process metadata so it can be listed and
        filtered without joining back to the instance.
      required:
        - incidentID
        - instanceID
        - nodeID
        - errorType
        - errorMessage
        - raisedAt
      properties:
        incidentID:
          type: string
          description: Engine-assigned incident identifier, unique within the instance. Resolve the incident with it.
        instanceID:
          type: string
          description: Identifier of the instance that produced the incident.
        processID:
          type: string
          description: BPMN process ID of the definition the instance is running.
        processName:
          type: string
          description: Human-readable name of the parent process definition.
        processVersion:
          type: integer
          description: Version of that process definition. With `processID` it addresses the exact version the incident was raised on.
        nodeID:
          type: string
          description: ID of the BPMN node where the error occurred.
        scopeID:
          type: string
          description: ID of the scope in which the error occurred.
        executionKey:
          type: string
          description: Execution key of the activity that failed.
        parentScopeID:
          type: string
          description: ID of the scope containing `scopeID`, empty for the root scope. Scope IDs are opaque, so this is how a client walks a failure back up the process tree.
        miIndex:
          type: integer
          description: Zero-based multi-instance body index when the failure happened inside one iteration of a multi-instance activity. Absent otherwise.
        errorType:
          type: string
          description: Category of the error - same enum as `BpmnIncident.errorType`.
          enum:
            - BpmnError
            - CompensationError
            - FeelError
            - GatewayNoMatch
            - TimerResolution
            - LinkNotFound
            - MigrationError
            - CallActivityCanceled
            - ExternalRowRefreshError
            - JobLockLost
            - DecisionNotFound
            - DecisionEvaluationError
            - ProcessNotFound
            - ProcessSuspended
            - Unknown
        errorCode:
          type: string
          description: BPMN error code from the process definition; empty for non-BPMN errors.
        errorMessage:
          type: string
          description: Human-readable description of the error.
        raisedAt:
          type: string
          format: date-time
          description: Timestamp when the engine recorded the incident.
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp when the incident was resolved. Empty while open.
        resolvedBy:
          type: string
          description: User or service account that resolved the incident. Empty for engine-internal resolves (boundary catches, modification cancel) and for open incidents.
    BpmnIncidentRecordPaginatedResponse:
      type: object
      description: Page of persisted incidents.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BpmnIncidentRecord'
        pagination:
          $ref: '#/components/schemas/CursorPage'
    ElementMapping:
      type: object
      description: Maps a BPMN flow node from the source process version to the corresponding node in the target version during migration.
      required:
        - sourceElementID
        - targetElementID
      properties:
        sourceElementID:
          type: string
          description: BPMN element id in the running instance's current process version.
        targetElementID:
          type: string
          description: BPMN element id in the target process version.
    MigrateBpmnInstanceRequest:
      type: object
      description: Payload for migrating a running instance to a different version of its process.
      required:
        - targetVersion
      properties:
        targetVersion:
          type: integer
          description: Version of the same process to migrate to.
        elementMappings:
          type: array
          description: Mappings for elements that have been renamed between versions. Elements with the same id in source and target are matched implicitly.
          items:
            $ref: '#/components/schemas/ElementMapping'
        variables:
          type: object
          description: Variables to merge into the instance scope as part of the migration. Useful for filling in inputs introduced in the target version.
          additionalProperties: true
          x-go-type: VariableMap
    MigrationValidationResult:
      type: object
      description: Outcome of validating a migration plan without executing it.
      properties:
        valid:
          type: boolean
          description: True when the plan can be applied as-is.
        issues:
          type: array
          description: Human-readable descriptions of problems that would prevent migration.
          items:
            type: string
    ModificationInstruction:
      type: object
      description: A single token-level operation applied to a running instance during a modification.
      required:
        - type
        - nodeID
      properties:
        type:
          type: string
          description: |
            Kind of operation:
              * `START_BEFORE_NODE` - activate `nodeID` in the given scope, optionally seeding `variables` first.
              * `CANCEL_TOKEN` - cancel the active token at `nodeID` in the given scope.
          enum:
            - START_BEFORE_NODE
            - CANCEL_TOKEN
        nodeID:
          type: string
          description: BPMN flow node id the instruction targets.
        scopeID:
          type: string
          description: Scope to apply the instruction in, as reported by the instance's active scopes. Empty applies to the root process scope, for both instruction types. A scope that is not live on the instance is rejected with a 400.
        variables:
          type: object
          description: Variables to inject into the scope for `START_BEFORE_NODE`.
          additionalProperties: true
          x-go-type: VariableMap
    ModifyBpmnInstanceRequest:
      type: object
      description: Payload for an ad-hoc modification of a running instance. Instructions are applied in order.
      required:
        - instructions
      properties:
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/ModificationInstruction'
    SuspendBpmnInstanceRequest:
      type: object
      description: Optional metadata captured with an instance-scope suspension.
      properties:
        reason:
          type: string
          description: Free-text rationale. Surfaces in the operator UI and the instance's history.
    SuspendBpmnDefinitionRequest:
      type: object
      description: Optional metadata captured with a definition-scope suspension. The same reason cascades to each running instance.
      properties:
        reason:
          type: string
    ExternalJob:
      type: object
      description: A unit of work emitted by a BPMN service task that an external worker is expected to handle. A job is kept until its instance ends, and from then on its instance's history holds it.
      required:
        - executionKey
        - instanceID
        - nodeID
        - taskType
        - status
        - createdAt
      properties:
        executionKey:
          type: string
          description: Stable key for the activity execution that produced the job. Used as the path parameter when completing or failing the job.
        instanceID:
          type: string
          description: Identifier of the instance that produced the job. Required when calling Complete / ThrowError.
        nodeID:
          type: string
          description: ID of the BPMN service-task node.
        taskType:
          type: string
          description: Worker selector. Workers poll for jobs by `taskType`.
        variables:
          type: object
          description: Input variables resolved by the service task at activity entry.
          additionalProperties: true
          x-go-type: VariableMap
        parentInstanceID:
          type: string
          description: Identifier of the parent instance (set when the producing instance was started by a CallActivity).
        status:
          type: string
          description: Lifecycle status of the job.
          enum:
            - PENDING
            - COMPLETED
            - CANCELED
            - FAILED
        retries:
          type: integer
          description: Remaining retry budget. A retryable worker error and a lock that runs out each use one.
        headers:
          type: object
          description: Static metadata attached at design time on the service task. Available to workers but not merged back into the instance.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the job was created.
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the job reached a terminal status.
        completedBy:
          type: string
          description: User or service account that reported the job's outcome. Empty while pending, and for a job the engine ended itself.
        lockedBy:
          type: string
          description: Worker `clientID` that currently holds the exclusive lock on the job.
        lockExpiresAt:
          type: string
          format: date-time
          description: Time at which the lock will be released if not extended via Heartbeat.
        cancelReason:
          type: string
          description: Best-effort label describing why a CANCELED job was interrupted (e.g. an interrupting boundary event, a migration).
        businessId:
          type: string
          description: Caller-supplied correlation key inherited from the parent BPMN process. Workers can use it for log correlation or downstream tracing.
        traceContext:
          type: object
          additionalProperties:
            type: string
          description: W3C trace-propagation carrier (e.g. `traceparent`/`tracestate`) captured from the originating process instance. Present only when distributed tracing is enabled on the server. SDK workers pass this map to their OpenTelemetry propagator's extract so the worker span joins the instance's trace; plain workers can ignore it.
    BpmnExternalJobPaginatedResponse:
      type: object
      description: Page of external jobs.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExternalJob'
        pagination:
          $ref: '#/components/schemas/CursorPage'
    ExternalJobQueueDepthItem:
      type: object
      description: PENDING job count for a single task type.
      required:
        - taskType
        - pendingCount
      properties:
        taskType:
          type: string
        pendingCount:
          type: integer
          format: int64
    ExternalJobQueueDepthResponse:
      type: object
      description: Per-task-type breakdown of pending external jobs.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalJobQueueDepthItem'
    PollBpmnJobRequest:
      type: object
      description: Long-poll request for external jobs.
      required:
        - taskType
        - clientID
      properties:
        taskType:
          type: string
          description: Selector for the kind of work the worker handles.
        clientID:
          type: string
          description: Stable identifier for this worker. Used to attribute job locks and to count active workers.
        lockDuration:
          type: string
          description: How long each acquired job stays locked to this worker without a heartbeat. Accepts Go duration strings (e.g. `5s`, `2m`). Defaults to `30s`, clamped by the server to 10s..5m.
        timeout:
          type: string
          description: How long to wait for a job before returning 204. Accepts Go duration strings. Defaults to `30s`.
        maxJobs:
          type: integer
          description: Maximum number of jobs to acquire in one call. Defaults to 1, capped at 100.
    ExternalJobBatchResponse:
      type: object
      description: Per-item result of a batch complete or batch error call.
      required:
        - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - executionKey
              - status
            properties:
              executionKey:
                type: string
                description: The execution key of the item from the request.
              status:
                type: string
                description: |
                  Outcome for this item:
                    * `completed` - the job was completed successfully.
                    * `failed` - the error was raised on the process, because no retries were left or `retryable` was false. An error boundary catches it, or it raises an incident.
                    * `requeued` - a retry budget remained, the job is back in PENDING.
                    * `error` - the per-item operation itself failed, and the job's state is unchanged.
                enum:
                  - completed
                  - failed
                  - requeued
                  - error
              error:
                type: string
                description: When `status` is `error`, a human-readable description of the failure.
    UserTask:
      type: object
      description: A human-handled work item produced by a BPMN user task.
      required:
        - executionKey
        - instanceID
        - nodeID
        - status
        - priority
        - createdAt
      properties:
        executionKey:
          type: string
          description: Stable key for the activity execution. Used as the path parameter when completing or failing the task.
        instanceID:
          type: string
          description: Identifier of the instance that produced the task.
        parentInstanceID:
          type: string
          description: Identifier of the parent instance (set when the producing instance was started by a CallActivity).
        nodeID:
          type: string
          description: ID of the BPMN node that emitted the task.
        assignee:
          type: string
          description: User the task is currently assigned to. Empty when the task is in a candidate pool but not yet claimed.
        candidateUsers:
          type: array
          description: Users who may claim or complete this task even when no `assignee` is set.
          items:
            type: string
        candidateGroups:
          type: array
          description: Identity-provider groups whose members may claim or complete this task.
          items:
            type: string
        dueDate:
          type: string
          format: date-time
          description: When the task is due, from the model's `taskSchedule`. Absent when the task has none.
        priority:
          type: integer
          minimum: 0
          maximum: 100
          description: The task's priority from the model's `priorityDefinition`, 50 when the model sets none.
        formKey:
          type: string
          description: Static form reference declared on the task (BPMN `formKey`). Resolved by the consumer to display the right UI.
        formID:
          type: string
          description: Resolved internal form identifier when `formKey` matches a stored form definition.
        variables:
          type: object
          description: Input variables resolved at activity entry. Available for rendering form defaults.
          additionalProperties: true
          x-go-type: VariableMap
        headers:
          type: object
          description: Static metadata attached at design time on the user task.
          additionalProperties:
            type: string
        status:
          type: string
          description: Lifecycle status of the task.
          enum:
            - CREATED
            - COMPLETED
            - CANCELED
            - FAILED
        cancelReason:
          type: string
          description: Best-effort label describing why a CANCELED task was interrupted (e.g. instance cancelled, boundary event interrupted).
        errorCode:
          type: string
          description: BPMN error code captured when the task was failed via ThrowError. Set only for FAILED tasks.
        completionVariables:
          type: object
          description: Variables submitted alongside the completion or error call. Set for COMPLETED and FAILED tasks.
          additionalProperties: true
          x-go-type: VariableMap
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created.
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the task reached a terminal status.
        completedBy:
          type: string
          description: User or service account that completed or failed the task. Empty while open, and for a task the engine ended itself.
        businessId:
          type: string
          description: Caller-supplied correlation key inherited from the parent BPMN process.
    BpmnUserTaskPaginatedResponse:
      type: object
      description: Page of user tasks.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserTask'
        pagination:
          $ref: '#/components/schemas/CursorPage'
    UpdateUserTaskAssignmentRequest:
      type: object
      description: |
        Reassign a CREATED user task. All fields are optional but at least one
        must be present, an empty body is rejected with 400. A field you leave out
        keeps its value. A list you send replaces the stored one, so pass the full
        set of candidateUsers / candidateGroups you want, not a delta.
      properties:
        assignee:
          type: string
          description: New assignee. An empty string clears it.
        candidateUsers:
          type: array
          description: Replaces the candidate users. An empty list clears them.
          items:
            type: string
        candidateGroups:
          type: array
          description: Replaces the candidate groups. An empty list clears them.
          items:
            type: string
    CorrelationKeyString:
      type: string
      description: A scalar string correlation value.
    CorrelationKeyNumber:
      type: number
      description: A scalar numeric correlation value, kept exact (json.Number) so large ids such as order numbers correlate.
      x-go-type: json.Number
    CorrelationKeyBoolean:
      type: boolean
      description: A scalar boolean correlation value.
    CorrelationKeyMap:
      type: object
      description: A multi-key correlation value, used when the subscription's correlation expression resolves to a context.
      additionalProperties: true
    CorrelationKeys:
      description: |
        Selects which subscription(s) receive a published message.

        The provided value - primitive (string, number, boolean) or object -
        must equal the subscription's resolved correlation value. Matching is
        type-sensitive: the number `123` does not match the string `"123"`.
        Numbers compare by value, so `1` matches `1.0`. Objects match when
        they hold the same keys with equal values, in any key order. Lists
        match element by element, in order.

        Omitted, the publish only triggers message start events, since every
        waiting catch declares a correlation value.
      oneOf:
        - $ref: '#/components/schemas/CorrelationKeyString'
        - $ref: '#/components/schemas/CorrelationKeyNumber'
        - $ref: '#/components/schemas/CorrelationKeyBoolean'
        - $ref: '#/components/schemas/CorrelationKeyMap'
    BpmnProcessSummary:
      type: object
      description: Aggregated counts for a process across all of its deployed versions.
      required:
        - processID
        - processName
        - versionCount
        - runningCount
        - totalCount
      properties:
        processID:
          type: string
          description: BPMN process id.
        processName:
          type: string
          description: Human-readable process name.
        versionCount:
          type: integer
          description: Number of deployed versions of this process.
        suspendedVersionCount:
          type: integer
          description: |
            How many versions of this process are paused. Zero means the process
            starts and dispatches normally; anything higher means at least one
            version rejects new instances. Filter the list with `suspended=true`
            to see only these.
        runningCount:
          type: integer
          description: Instances with status RUNNING across all versions.
        totalCount:
          type: integer
          description: All instances across all versions.
    BpmnProcessSummaryPaginatedResponse:
      type: object
      description: Page of process summaries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BpmnProcessSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    BpmnProcessVersion:
      type: object
      description: One deployed version of a process, with instance counts. `processID` and `version` address it.
      required:
        - processID
        - processName
        - version
        - createdAt
        - runningCount
        - totalCount
      properties:
        resourceID:
          type: string
          format: uuid
          description: BPMN resource version it was deployed from. Empty for a version deployed from no resource.
        resourceName:
          type: string
          description: Display name of that resource.
        processID:
          type: string
          description: BPMN process id.
        processName:
          type: string
          description: Human-readable process name.
        version:
          type: integer
          description: Version number, starting at 1 for the first deploy.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this version was deployed.
        deployedBy:
          type: string
          description: User or service account that deployed this version.
        runningCount:
          type: integer
          description: Instances of this version with status RUNNING.
        totalCount:
          type: integer
          description: All instances of this version across statuses.
        suspendedAt:
          type: string
          format: date-time
          description: |
            Timestamp at which this definition was paused. While set, the start
            endpoint rejects new instances of this definition with 409, and every
            already-running instance was sent a definition-scope suspend signal.
            Empty when active.
        suspendedBy:
          type: string
          description: Operator who suspended this definition. Empty when active.
        suspendReason:
          type: string
          description: Free-text reason captured at suspend time.
    BpmnProcessVersionPaginatedResponse:
      type: object
      description: Page of process version entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BpmnProcessVersion'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
