openapi: 3.0.0
info:
  title: QuantumBPM API (Public)
  version: 2.0.1
  description: Public API for the QuantumBPM application. SDKs are generated from this spec.
paths:
  /version:
    get:
      summary: Version
      operationId: GetVersion
      x-required-role: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 1.0.0
  /dmn/evaluate/design:
    post:
      summary: Evaluate ad-hoc DMN XML
      operationId: EvaluateDesign
      x-required-role: authenticated
      description: |
        Evaluates DMN XML supplied in the request without storing it. Useful for
        testing decisions during authoring or for one-off evaluations that do
        not need to be tracked. Use the project-scoped evaluation endpoints
        against deployed definitions instead when running production workloads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - xml
              properties:
                xml:
                  type: string
                  description: DMN XML to evaluate.
                additionalXMLs:
                  type: array
                  description: Additional DMN XML documents whose decisions are imported and may be referenced from `xml`.
                  items:
                    type: string
                context:
                  $ref: '#/components/schemas/FeelContext'
                decisionServices:
                  type: array
                  items:
                    type: string
                  description: Names of decision services to evaluate. If empty, no decision services are evaluated.
                decisions:
                  type: array
                  items:
                    type: string
                  description: Names of decisions or decision services to evaluate. If empty, all decisions in the document are evaluated.
                errorMode:
                  $ref: '#/components/schemas/ErrorMode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/EvaluationResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /dmn/evaluate/design/batch:
    post:
      summary: Batch evaluate ad-hoc DMN XML against multiple inputs
      operationId: EvaluateDesignBatch
      x-required-role: authenticated
      description: |
        Evaluates a single DMN document against many input rows in one request.
        Useful for bulk testing during decision authoring (e.g. running a
        spreadsheet of expected cases through a draft decision table).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchEvaluateDesignRequest'
      responses:
        '200':
          description: Batch evaluation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEvaluationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects:
    get:
      summary: List Projects
      operationId: ListProjects
      x-required-role: authenticated
      description: |
        Lists the projects the caller's token grants access to. Projects come
        from the deployment's provisioning file.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}:
    get:
      summary: Get Project
      operationId: GetProject
      x-required-role: viewer
      description: Returns the project's metadata.
      parameters:
        - name: projectID
          in: path
          required: true
          description: Identifier of the project to fetch.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions:
    get:
      summary: List DMN definitions
      operationId: ListDefinitions
      x-required-role: viewer
      description: Lists every saved definition in the project, drafts and deployed, newest first.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page (max 100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDefinitionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a DMN definition
      operationId: CreateDefinition
      x-required-role: editor
      description: |
        Saves a new draft. A draft is not evaluable until `DeployDefinition`
        deploys it. To change a deployed definition, save its new XML as
        another draft of the same `definitionsID` and deploy that. XML
        identical to the latest deployed version of its `definitionsID` is
        refused with 409, and nothing is saved.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDefinitionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Definition'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions/latest:
    get:
      summary: List latest DMN definitions
      operationId: ListLatestDefinitions
      x-required-role: viewer
      description: Returns the newest saved definition of each `definitionsID`, draft or deployed.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page (max 100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDefinitionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions/by-definitions-id/{definitionsID}:
    get:
      summary: Get a DMN definition by its DMN definitions id
      description: |
        Looks up a deployed definition by the `id` attribute on the
        `<definitions>` root element of the DMN XML, instead of by the
        platform-internal `id`. Returns the latest deployed version unless
        `version` names one. A draft is not found this way.
      operationId: GetDefinitionByDefinitionsID
      x-required-role: viewer
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionsID
          in: path
          required: true
          schema:
            type: string
          description: Stable identifier from the DMN XML's outer `<definitions id="…">` attribute.
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: Deployed version, the latest when omitted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Definition'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions/by-definitions-id/{definitionsID}/versions:
    get:
      summary: List all versions of a DMN definition
      operationId: ListDefinitionVersions
      x-required-role: viewer
      description: Returns every saved definition of a DMN `<definitions id>`, drafts and deployed, newest first. A deployed one carries the version its deploy gave it.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionsID
          in: path
          required: true
          schema:
            type: string
          description: Stable identifier from the DMN XML's outer `<definitions id="…">` attribute.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page (max 100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDefinitionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions/by-definitions-id/{definitionsID}/evaluate:
    post:
      summary: Evaluate a DMN definition by its DMN definitions id
      description: |
        Evaluates a deployed DMN definition addressed by its `<definitions id>`
        XML attribute, the latest deployed version unless `version` names one,
        and records the evaluation. A definition with no deployed version
        answers 404. Drafts evaluate through `EvaluateDesign`.
      operationId: EvaluateByDefinitionsID
      x-required-role: executor
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionsID
          in: path
          required: true
          schema:
            type: string
          description: Stable identifier from the DMN XML's outer `<definitions id="…">` attribute.
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: Deployed version, the latest when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateStoredRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/EvaluationResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions/{definitionID}:
    get:
      summary: Get a DMN definition
      operationId: GetDefinition
      x-required-role: viewer
      description: Returns a single definition version by its platform identifier.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Definition'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a DMN definition version
      operationId: UpdateDefinition
      x-required-role: editor
      description: Replaces the name and XML of a draft. A deployed definition is read-only and answers 409, so save the change as a new draft instead.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDefinitionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Definition'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a DMN definition version
      operationId: DeleteDefinition
      x-required-role: editor
      description: Permanently deletes a draft. A deployed definition answers 409, since the engine keeps its version and evaluations.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/definitions/{definitionID}/deploy:
    post:
      summary: Deploy a DMN definition
      operationId: DeployDefinition
      x-required-role: editor
      description: |
        Deploys a draft, which makes its decisions evaluable and callable from
        business rule tasks. Its document gets the next version of its
        `definitionsID`, and each decision the next version of its decision id.
        A draft identical to the latest deployed version is refused with 409. A
        deployed definition is read-only, and deploying it again answers 409.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Definition'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/decisions:
    get:
      summary: List decisions
      description: |
        Returns one row per deployed decision in the project, at its latest
        version and with the definition that version came from. Useful for
        picking a target decision when wiring a BPMN BusinessRuleTask.
      operationId: ListDecisions
      x-required-role: viewer
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page (max 100)
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional case-insensitive substring match against decision name, decision id, or owning definition name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDecisionsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/dmn/decisions/{decisionID}/versions:
    get:
      summary: List a decision's deployed versions
      description: |
        Returns every deployed version of a decision, the latest first, with
        the DMN definition version it came from. Decision versions count per
        decision id, and a BPMN BusinessRuleTask that binds a version names one
        of them.
      operationId: ListDecisionVersions
      x-required-role: viewer
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: decisionID
          in: path
          required: true
          schema:
            type: string
          description: ID of the decision node from the DMN XML.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionVersionList'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/dmn/executions:
    get:
      summary: List DMN executions across the project
      operationId: ListProjectExecutions
      x-required-role: viewer
      description: |
        Returns the project's recorded decision evaluations, newest first:
        those of `EvaluateByDefinitionsID` and of business rule tasks. A test
        run's evaluations are left out.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: definitionsID
          in: query
          required: false
          schema:
            type: string
          description: Filter by DMN `<definitions id>` (XML id).
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: Only evaluations of this deployed version of `definitionsID`. Ignored without `definitionsID`.
        - name: businessId
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Exact-match filter on the caller-supplied correlation key.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only return executions at or after this instant (ISO 8601). Bounds the scan and the reported total; omit for the full unbounded history.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page (max 100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExecutionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/dmn/executions/{executionID}:
    get:
      summary: Get a single DMN execution
      operationId: GetExecution
      x-required-role: viewer
      description: Returns the inputs and per-decision results of a single recorded evaluation.
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: executionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectID}/bpmn/resources:
    get:
      summary: List BPMN resources
      operationId: ListBpmnResources
      x-required-role: viewer
      description: Returns all BPMN resource versions in the project, including drafts and deployed versions.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnResourcePaginatedResponse'
    post:
      summary: Create a BPMN resource
      operationId: CreateBpmnResource
      x-required-role: editor
      description: |
        Uploads a new BPMN XML resource as a draft. Drafts can be edited and
        tested but cannot start production instances until they are deployed.
        Invalid XML is rejected. XML identical to the latest deployed resource
        of the same `<definitions id>` is refused with 409, and nothing is
        saved.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBpmnResourceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnResourceDetail'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectID}/bpmn/resources/{resourceID}:
    get:
      summary: Get a BPMN resource
      operationId: GetBpmnResource
      x-required-role: viewer
      description: Returns the XML and parsed metadata for a single resource version.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnResourceDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a draft BPMN resource
      operationId: UpdateBpmnResource
      x-required-role: editor
      description: |
        Replaces the XML of an existing draft resource. Once a resource has
        been deployed it is immutable; deploy a new version instead.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
