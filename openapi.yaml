    delete:
      summary: Delete a BPMN resource version
      operationId: DeleteBpmnResource
      x-required-role: editor
      description: |
        Permanently deletes a single resource version. Past instances of this
        version remain in history. Refused with 409 Conflict while any version
        of any process inside the resource still has running instances.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectID}/bpmn/resources/{resourceID}/deploy:
    post:
      summary: Deploy a BPMN resource
      operationId: DeployBpmnResource
      x-required-role: editor
      description: |
        Marks all processes inside the resource as executable, making them
        available to start instances of. Each of them gets its next version.
        Deployment is one-way. To change a deployed resource, upload a new
        version and deploy that. A resource identical to the latest deployed
        resource of the same `<definitions id>` is refused with 409, and
        deploying that latest one again changes nothing.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/bpmn/resources/{resourceID}/test:
    post:
      summary: Start a test instance from a resource
      operationId: StartBpmnTestInstance
      x-required-role: editor
      description: |
        Starts a test instance of a resource, draft or deployed. A draft can
        only be started this way, which makes it the way to try out an
        in-progress design before deploying. A suspended definition does not
        stop it, since the test run takes no deployed version.

        A test run runs on the same engine as production but stays apart from
        it, and so do its call-activity children. It stays a test run for
        life, also after a migration to a deployed version.
        - Its job task types, message names and signal names carry the
          `draft:` prefix. A worker activates `draft:<type>` to work its jobs,
          and a publish names `draft:<name>` to reach it.
        - Its user tasks, jobs and incidents list only when `instanceID` names
          it.
        - Instance counts, analytics and job queue depth leave it out. The
          instance list shows it, with `draft` set.
      tags:
        - bpmn
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBpmnTestInstanceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceID:
                    type: string
                    description: Identifier of the new test instance.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectID}/bpmn/resources/latest:
    get:
      summary: List the latest version of each BPMN resource
      operationId: ListLatestBpmnResources
      x-required-role: viewer
      description: Returns one entry per unique BPMN definitions id, with the most recent version's metadata.
      tags:
